<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Job-Alert</title>
<!-- Inclusion de PDF.js pour la lecture et le scan des fichiers PDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
</script>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#182230;--muted:#667085;--border:#e4e7ec;--primary:#2563eb;--primary-dark:#1d4ed8;--green:#15803d;--red:#dc2626;--shadow:0 4px 18px rgba(16,24,40,.07)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}button,input,textarea,select{font:inherit}button{-webkit-tap-highlight-color:transparent}
.header{background:#111827;color:#fff;padding:14px 20px;position:sticky;top:0;z-index:1000;box-shadow:0 2px 10px rgba(0,0,0,.2)}
.header-inner{max-width:1200px;margin:auto;display:flex;align-items:center;justify-content:space-between}.logo{font-size:20px;font-weight:800;white-space:nowrap}.logo span{color:#60a5fa}
.profile-menu-container{position:relative}.profile-avatar{width:42px;height:42px;border-radius:50%;background:#1f2937;border:2px solid #374151;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;padding:0}.profile-avatar:hover{background:#374151}
.profile-dropdown{position:absolute;right:0;top:calc(100% + 10px);background:#fff;color:var(--text);border:1px solid var(--border);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.25);width:240px;display:none;z-index:99999;overflow:hidden}.profile-dropdown.open{display:block}
.dropdown-header{padding:14px 16px;border-bottom:1px solid var(--border);background:#f8fafc}.dropdown-name{font-weight:800;font-size:14px}.dropdown-subtitle{color:var(--muted);font-size:12px;margin-top:3px}
.dropdown-item{width:100%;border:0;background:#fff;padding:14px 16px;text-align:left;cursor:pointer;display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;color:var(--text)}.dropdown-item:hover{background:#f8fafc;color:var(--primary)}.dropdown-item.danger{color:var(--red)}
.container{max-width:1200px;margin:auto;padding:24px 16px 50px}.view-switcher{display:flex;justify-content:center;gap:10px;margin-bottom:24px}.tab-button{background:#fff;border:1px solid var(--border);color:var(--muted);padding:10px 24px;border-radius:30px;cursor:pointer;font-weight:600;font-size:14px;box-shadow:var(--shadow)}.tab-button.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.page-title{margin:0;font-size:27px}.page-description{color:var(--muted);margin:7px 0 20px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}.stat{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px}.stat-number{font-size:23px;font-weight:800}.stat-label{color:var(--muted);font-size:12px;margin-top:3px}
.search-card,.profile-card,.alert-card,.application-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;box-shadow:var(--shadow);margin-bottom:18px}.search-grid{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:10px}
.input,.textarea,.select{width:100%;min-height:44px;border:1px solid var(--border);border-radius:9px;padding:10px 12px;background:#fff;color:var(--text)}.textarea{min-height:100px;resize:vertical}.search-button{border:0;border-radius:9px;padding:0 20px;background:var(--primary);color:#fff;font-weight:700;cursor:pointer;min-height:44px}.search-button:hover{background:var(--primary-dark)}
.advanced{margin-top:12px}.advanced summary{cursor:pointer;color:var(--primary);font-size:14px;font-weight:600}.advanced-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}.results-header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.results-count{color:var(--muted);font-size:14px}.sort{width:190px}.jobs{display:grid;gap:12px}
.job{background:#fff;border:1px solid var(--border);border-radius:14px;padding:18px;box-shadow:var(--shadow)}.job-top{display:flex;justify-content:space-between;gap:15px}.job-title{font-size:18px;font-weight:750;margin:0 0 5px}.company{color:#475467;font-size:14px}.score{background:#ecfdf3;color:var(--green);font-size:13px;font-weight:700;border-radius:20px;padding:7px 10px;white-space:nowrap;height:fit-content}.meta{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0}.tag{background:#f2f4f7;color:#475467;padding:5px 8px;border-radius:6px;font-size:12px}.salary{font-size:15px;font-weight:750;color:var(--green);margin-bottom:10px}.ai-advice{background:#ecfdf3;border-left:4px solid var(--green);padding:10px;border-radius:6px;font-size:13px;color:var(--green);margin-bottom:14px}.job-footer{border-top:1px solid var(--border);margin-top:14px;padding-top:12px;display:flex;justify-content:space-between;align-items:center;gap:10px}.date{color:var(--muted);font-size:12px}.job-actions{display:flex;gap:8px;flex-wrap:wrap}.small-button{border:1px solid var(--border);background:#fff;border-radius:8px;padding:8px 12px;cursor:pointer;font-size:12px}.small-button:hover{background:#f8fafc}.small-button.favorite{color:#b45309;border-color:#f59e0b}.status-select{min-height:38px;border:1px solid var(--border);border-radius:8px;padding:0 8px;background:#fff;font-size:12px}
.application-row{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:14px 0;border-bottom:1px solid var(--border)}.application-row:last-child{border-bottom:0}.application-title{font-weight:700;margin-bottom:4px}.application-company{color:var(--muted);font-size:13px}.application-status{background:#eff6ff;color:var(--primary);border-radius:20px;padding:6px 10px;font-size:12px;font-weight:700}
.empty{background:#fff;border:1px dashed var(--border);border-radius:14px;padding:40px 20px;text-align:center;color:var(--muted)}.profile-section-title{font-size:15px;font-weight:800;margin-bottom:12px}.field{margin-bottom:16px}.field label{display:block;font-weight:700;margin-bottom:6px;font-size:14px}
.scan-status{font-size:13px;font-weight:700;color:var(--primary);margin-top:8px}
/* Styles pastilles de compétences */
.skills-container{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;margin-bottom:12px;min-height:36px;padding:8px;background:#f8fafc;border:1px solid var(--border);border-radius:9px}
.skill-pill{background:#eff6ff;color:var(--primary);border:1px solid #bfdbfe;padding:6px 12px;border-radius:20px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.skill-pill button{background:none;border:none;color:var(--primary);cursor:pointer;font-weight:bold;font-size:14px;padding:0;line-height:1}
.skill-pill button:hover{color:var(--red)}
.skill-add-row{display:flex;gap:8px}
@media(max-width:800px){.search-grid{grid-template-columns:1fr}.advanced-grid{grid-template-columns:1fr 1fr}}
@media(max-width:500px){.header{padding:12px 14px}.logo{font-size:17px}.container{padding:18px 10px 40px}.view-switcher{margin-bottom:18px}.tab-button{padding:9px 16px;font-size:13px}.advanced-grid{grid-template-columns:1fr}.stats{gap:6px}.stat{padding:10px}.stat-number{font-size:19px}.job{padding:14px}.job-top{display:block}.score{display:inline-block;margin-top:10px}.job-footer{align-items:flex-start;flex-direction:column}.job-actions{width:100%}.small-button,.status-select{flex:1}.profile-dropdown{width:220px}.application-row{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<header class="header">
<div class="header-inner">
<div class="logo">🎯 Job-<span>Alert</span></div>
<div class="profile-menu-container">
<button class="profile-avatar" id="avatarBtn" type="button" title="Mon espace">👤</button>
<div class="profile-dropdown" id="profileDropdown">
<div class="dropdown-header"><div class="dropdown-name">Mon espace</div><div class="dropdown-subtitle">Gère ton profil et tes recherches</div></div>
<button class="dropdown-item" id="profileBtn">📄 Mon CV / Profil</button>
<button class="dropdown-item" id="applicationsBtn">📋 Mes candidatures</button>
<button class="dropdown-item" id="alertsBtn">🔔 Mes alertes</button>
<button class="dropdown-item danger" id="resetBtn">♻️ Réinitialiser les données</button>
</div>
</div>
</div>
</header>
<div class="container">
<div class="view-switcher" id="viewSwitcher">
<button class="tab-button active" id="navSearch" type="button">🔎 Recherche</button>
<button class="tab-button" id="navFavorites" type="button">⭐ Favoris</button>
</div>
<main class="main" id="mainContent"></main>
</div>
<script>
const jobs=[
{id:1,title:"Responsable Expérience Client",company:"TechCorp Paris",location:"Paris",contract:"CDI",remote:"Oui",salary:65000,maxSalary:75000,score:96,date:"2026-08-14",tags:["Expérience Client","VoC","Management","Gestion de projet","Orienté résultats"],source:"Entreprise",aiAdvice:"💡 Conseil IA : Forte correspondance avec ton savoir-faire et tes indicateurs de résultats."},
{id:2,title:"Responsable Satisfaction Client",company:"Inovium Group",location:"Île-de-France",contract:"CDI",remote:"Oui",salary:60000,maxSalary:70000,score:92,date:"2026-08-13",tags:["Customer Experience","Management","Relation client"],source:"LinkedIn",aiAdvice:"💡 Conseil IA : Excellent alignement avec tes compétences relationnelles et de pilotage."},
{id:3,title:"Product Owner Data",company:"DataPulse",location:"Paris",contract:"CDI",remote:"Oui",salary:55000,maxSalary:68000,score:84,date:"2026-08-11",tags:["Product","Data","Agile","Gestion de projet"],source:"France Travail",aiAdvice:"💡 Conseil IA : Opportunité axée sur la gestion de projet et l'analyse de données."},
{id:4,title:"Chef de Projet Expérience Client",company:"Symphony CX",location:"Boulogne-Billancourt",contract:"CDI",remote:"Oui",salary:50000,maxSalary:60000,score:78,date:"2026-08-09",tags:["CX","Parcours Client","Gestion de projet","Voix du Client"],source:"LinkedIn",aiAdvice:"💡 Conseil IA : Parfaitement adapté à ton expertise en gestion de projet CX."}
];

function loadJSON(key,fallback){try{const value=localStorage.getItem(key);return value?JSON.parse(value):fallback}catch(e){return fallback}}
let favorites=loadJSON("jobAlertFavorites",[]);
let applications=loadJSON("jobAlertApplications",{});
let userProfile=loadJSON("jobAlertProfile",{
  cvText:"Expérience en gestion de projet, relation client, satisfaction client, déploiement de solutions et management d'équipe avec augmentation de +25% de la satisfaction.",
  skills:["Gestion de projet", "Expérience Client", "Management", "Orienté résultats", "Relation client"],
  exclusions:"",
  minSalary:40000
});
let alertConfig=loadJSON("jobAlertConfig",{searchQuery:"",locationQuery:"",aiPrompt:"Recherche les offres correspondant à mon savoir-faire et mes compétences clés.",frequency:"Quotidienne",time:"20:00"});
let currentView="search";

function saveData(){localStorage.setItem("jobAlertFavorites",JSON.stringify(favorites));localStorage.setItem("jobAlertApplications",JSON.stringify(applications));localStorage.setItem("jobAlertProfile",JSON.stringify(userProfile));localStorage.setItem("jobAlertConfig",JSON.stringify(alertConfig))}
function setActiveTab(id){document.querySelectorAll(".tab-button").forEach(b=>b.classList.remove("active"));const b=document.getElementById(id);if(b)b.classList.add("active")}
function closeProfileMenu(){const d=document.getElementById("profileDropdown");if(d)d.classList.remove("open")}
function toggleProfileMenu(e){if(e)e.stopPropagation();document.getElementById("profileDropdown").classList.toggle("open")}
document.getElementById("avatarBtn").addEventListener("click",toggleProfileMenu);
document.addEventListener("click",e=>{const d=document.getElementById("profileDropdown"),a=document.getElementById("avatarBtn");if(d&&!d.contains(e.target)&&!a.contains(e.target))closeProfileMenu()});

function renderSearchPage(){
currentView="search";setActiveTab("navSearch");document.getElementById("viewSwitcher").style.display="flex";
document.getElementById("mainContent").innerHTML=`
<h1 class="page-title">Trouver ton prochain poste</h1>
<p class="page-description">Recherche basée sur ton savoir-faire, tes compétences et expertises clés.</p>
<section class="stats">
<div class="stat"><div class="stat-number" id="totalJobs">0</div><div class="stat-label">offres affichées</div></div>
<div class="stat"><div class="stat-number" id="favoriteCount">${favorites.length}</div><div class="stat-label">favoris</div></div>
<div class="stat"><div class="stat-number" id="applicationCount">${Object.keys(applications).length}</div><div class="stat-label">candidatures</div></div>
</section>
<section class="search-card">
<div class="search-grid">
<input id="search" class="input" placeholder="Compétence, mot-clé, savoir-faire...">
<input id="location" class="input" placeholder="Localisation">
<input id="minSalary" class="input" type="number" placeholder="Salaire min. €">
<button class="search-button" id="searchButton">Rechercher</button>
</div>
<details class="advanced"><summary>Filtres avancés</summary>
<div class="advanced-grid">
<input id="company" class="input" placeholder="Entreprise">
<select id="contract" class="select"><option value="">Contrat</option><option value="CDI">CDI</option><option value="CDD">CDD</option><option value="Freelance">Freelance</option></select>
<select id="remote" class="select"><option value="">Télétravail</option><option value="Oui">Télétravail possible</option><option value="Non">Pas de télétravail</option></select>
<select id="sort" class="select"><option value="score">Pertinence (Match)</option><option value="date">Plus récentes</option><option value="salary">Salaire décroissant</option></select>
</div></details>
</section>
<div class="results-header"><div class="results-count" id="resultsCount"></div><select id="sortMobile" class="select sort"><option value="score">Pertinence (Match)</option><option value="date">Plus récentes</option><option value="salary">Salaire décroissant</option></select></div>
<section id="jobs" class="jobs"></section>`;
["search","location","company","minSalary"].forEach(id=>document.getElementById(id).addEventListener("input",searchJobs));
document.getElementById("contract").addEventListener("change",searchJobs);
document.getElementById("remote").addEventListener("change",searchJobs);
document.getElementById("sort").addEventListener("change",searchJobs);
document.getElementById("sortMobile").addEventListener("change",changeSort);
document.getElementById("searchButton").addEventListener("click",searchJobs);
searchJobs();
}

function searchJobs(){
if(currentView!=="search")return;
const search=document.getElementById("search")?.value.trim().toLowerCase()||"";
const location=document.getElementById("location")?.value.trim().toLowerCase()||"";
const company=document.getElementById("company")?.value.trim().toLowerCase()||"";
const salary=Number(document.getElementById("minSalary")?.value)||0;
const contract=document.getElementById("contract")?.value||"";
const remote=document.getElementById("remote")?.value||"";
const sort=document.getElementById("sort")?.value||"score";

let results=jobs.filter(job=>{
const text=(job.title+" "+job.company+" "+job.location+" "+job.tags.join(" ")).toLowerCase();
const exclusionWords=(userProfile.exclusions||"").toLowerCase().split(",").map(w=>w.trim()).filter(Boolean);
if(exclusionWords.some(w=>text.includes(w)))return false;

if(search && !text.includes(search)) return false;
if(location && !job.location.toLowerCase().includes(location)) return false;
if(company && !job.company.toLowerCase().includes(company)) return false;
if(salary && job.maxSalary < salary) return false;
if(contract && job.contract !== contract) return false;
if(remote && job.remote !== remote) return false;

return true;
});

// Calcul dynamique du score de pertinence basé sur les compétences du profil
results.forEach(job => {
  if(userProfile.skills && userProfile.skills.length > 0) {
    let matchedSkillsCount = userProfile.skills.filter(skill => 
      job.tags.some(t => t.toLowerCase().includes(skill.toLowerCase())) || job.title.toLowerCase().includes(skill.toLowerCase())
    ).length;
    job.score = Math.min(99, 65 + (matchedSkillsCount * 10));
  }
});

if(sort==="salary")results.sort((a,b)=>b.salary-a.salary);
if(sort==="date")results.sort((a,b)=>new Date(b.date)-new Date(a.date));
if(sort==="score")results.sort((a,b)=>b.score-a.score);
displayJobs(results);
}

function displayJobs(results){
const container=document.getElementById("jobs");if(!container)return;
const total=document.getElementById("totalJobs");if(total)total.textContent=results.length;
const count=document.getElementById("resultsCount");if(count)count.textContent=results.length+" offre"+(results.length>1?"s":"");
if(!results.length){container.innerHTML='<div class="empty"><strong>Aucune offre trouvée</strong><br><span>Modifie tes critères ou tes compétences clés.</span></div>';return}
container.innerHTML=results.map(job=>{
const fav=favorites.includes(job.id),app=applications[job.id]||"";
return `<article class="job"><div class="job-top"><div><h2 class="job-title">${job.title}</h2><div class="company">${job.company} · ${job.location}</div></div><div class="score">${job.score}% match</div></div><div class="meta"><span class="tag">${job.contract}</span><span class="tag">${job.remote==="Oui"?"Télétravail":"Sur site"}</span>${job.tags.map(t=>`<span class="tag">${t}</span>`).join("")}</div><div class="salary">${job.salary.toLocaleString("fr-FR")} – ${job.maxSalary.toLocaleString("fr-FR")} € / an</div><div class="ai-advice">${job.aiAdvice}</div><div class="job-footer"><div class="date">Publiée le ${new Date(job.date).toLocaleDateString("fr-FR")} · ${job.source}</div><div class="job-actions"><button class="small-button ${fav?"favorite":""}" onclick="toggleFavorite(${job.id})">${fav?"★ Favori":"☆ Favori"}</button><select class="status-select" onchange="setApplication(${job.id},this.value)"><option value="">Suivi</option><option value="À contacter" ${app==="À contacter"?"selected":""}>À contacter</option><option value="Candidature envoyée" ${app==="Candidature envoyée"?"selected":""}>Candidature envoyée</option><option value="Entretien" ${app==="Entretien"?"selected":""}>Entretien</option></select></div></div></article>`}).join("");
}

function toggleFavorite(id){favorites.includes(id)?favorites=favorites.filter(x=>x!==id):favorites.push(id);saveData();currentView==="search"?searchJobs():showFavorites()}
function setApplication(id,status){status?applications[id]=status:delete applications[id];saveData();updateCounters()}
function updateCounters(){const f=document.getElementById("favoriteCount"),a=document.getElementById("applicationCount");if(f)f.textContent=favorites.length;if(a)a.textContent=Object.keys(applications).length}
function showFavorites(){
currentView="favorites";setActiveTab("navFavorites");document.getElementById("viewSwitcher").style.display="flex";
document.getElementById("mainContent").innerHTML='<h1 class="page-title">Mes Offres Favorites</h1><p class="page-description">Retrouve ici les opportunités basées sur ton savoir-faire.</p><section id="jobs" class="jobs"></section>';
displayJobs(jobs.filter(j=>favorites.includes(j.id)));
}

// --- GESTION PROFIL & PASTILLES DE COMPÉTENCES ---
function showProfile(){
currentView="profile";closeProfileMenu();document.querySelectorAll(".tab-button").forEach(b=>b.classList.remove("active"));document.getElementById("viewSwitcher").style.display="none";

document.getElementById("mainContent").innerHTML=`
<h1 class="page-title">Mon Profil & Savoir-faire</h1>
<p class="page-description">Importe ton CV PDF et clique sur "Analyser mes compétences" pour remplir automatiquement tes pastilles.</p>

<div class="profile-card">
  <div class="profile-section-title">🤖 Assistant Scan de CV (PDF)</div>
  <div class="field">
    <label>📄 Déposer votre fichier CV (.pdf)</label>
    <input type="file" id="cvFile" accept=".pdf" class="input" style="padding:6px; cursor:pointer;">
    <button class="search-button" id="analyzeCvBtn" type="button" style="margin-top:12px; width:100%;">🔍 Analyser mes compétences</button>
    <div id="cvScanStatus" class="scan-status"></div>
  </div>
</div>

<div class="profile-card">
  <div class="profile-section-title">🏷️ Mes compétences (Savoir-faire)</div>
  <p style="font-size:13px; color:var(--muted); margin-top:0;">
    Gère tes pastilles de compétences ci-dessous, ou <span style="color:var(--primary); font-weight:bold; cursor:pointer; text-decoration:underline;" onclick="document.getElementById('cvFile').click()">clique ici pour charger ton CV</span>.
  </p>
  
  <div id="skillsListContainer" class="skills-container"></div>

  <div class="skill-add-row" style="margin-top: 12px;">
    <input id="newSkillInput" class="input" placeholder="Ajouter une compétence ou un savoir-faire...">
    <button class="search-button" id="addSkillBtn" type="button" style="white-space:nowrap;">Ajouter</button>
  </div>
</div>

<div class="profile-card">
  <div class="profile-section-title">⚙️ Paramètres complémentaires</div>
  <div class="field">
    <label>📄 Texte brut extrait du CV</label>
    <textarea id="cvInput" class="textarea">${escapeHTML(userProfile.cvText)}</textarea>
  </div>
  <div class="field">
    <label>❌ Mots-clés / domaines à exclure</label>
    <input id="exclusionInput" class="input" value="${escapeHTML(userProfile.exclusions)}" placeholder="Ex : commercial, support technique">
  </div>
  <div class="field">
    <label>💰 Salaire minimum souhaité (€)</label>
    <input id="salaryInput" class="input" type="number" value="${userProfile.minSalary}">
  </div>
  <button class="search-button" id="saveProfileBtn" style="width:100%;">Enregistrer mon profil</button>
</div>
<button class="small-button" id="backProfileBtn">← Retour à la recherche</button>`;

renderSkillsPills();

document.getElementById("analyzeCvBtn").addEventListener("click", handlePdfAnalysis);
document.getElementById("addSkillBtn").addEventListener("click", addNewSkill);
document.getElementById("newSkillInput").addEventListener("keypress", (e) => { if(e.key === 'Enter') { e.preventDefault(); addNewSkill(); } });
document.getElementById("saveProfileBtn").addEventListener("click", saveProfileData);
document.getElementById("backProfileBtn").addEventListener("click", renderSearchPage);
}

function renderSkillsPills() {
  const container = document.getElementById("skillsListContainer");
  if(!container) return;
  if(!userProfile.skills || userProfile.skills.length === 0) {
    container.innerHTML = '<span style="color:var(--muted); font-size:13px; padding:4px;">Aucune compétence définie. Ajoute-en une ci-dessous ou analyse ton CV.</span>';
    return;
  }
  container.innerHTML = userProfile.skills.map((skill, index) => `
    <div class="skill-pill">
      <span>${escapeHTML(skill)}</span>
      <button type="button" onclick="removeSkill(${index})" title="Supprimer">×</button>
    </div>
  `).join("");
}

function addNewSkill() {
  const input = document.getElementById("newSkillInput");
  const val = input.value.trim();
  if(val && !userProfile.skills.includes(val)) {
    userProfile.skills.push(val);
    input.value = "";
    renderSkillsPills();
  }
}

window.removeSkill = function(index) {
  userProfile.skills.splice(index, 1);
  renderSkillsPills();
}

async function handlePdfAnalysis() {
  const fileInput = document.getElementById("cvFile");
  const file = fileInput.files[0];
  const statusEl = document.getElementById("cvScanStatus");

  if (!file) {
    statusEl.textContent = "⚠️ Veuillez d'abord sélectionner un fichier PDF.";
    return;
  }

  statusEl.textContent = "🔄 Analyse intelligente de votre CV en cours...";

  try {
    const arrayBuffer = await file.arrayBuffer();
    const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer });
    const pdfDoc = await loadingTask.promise;
    let fullText = "";

    for (let i = 1; i <= pdfDoc.numPages; i++) {
      const page = await pdfDoc.getPage(i);
      const textContent = await page.getTextContent();
      const pageText = textContent.items.map(item => item.str).join(" ");
      fullText += pageText + "\n";
    }

    if (!fullText.trim()) {
      statusEl.textContent = "⚠️ Le fichier PDF semble vide ou illisible.";
      return;
    }

    parseAndSmartExtract(fullText);
    statusEl.textContent = "✅ Analyse réussie ! Vos compétences ont été remplies automatiquement ci-dessous.";
  } catch (error) {
    console.error("Erreur lecture PDF:", error);
    statusEl.textContent = "❌ Erreur lors de la lecture du fichier PDF.";
  }
}

function parseAndSmartExtract(text) {
  const cleanText = text.trim();
  document.getElementById("cvInput").value = cleanText.substring(0, 2000) + (cleanText.length > 2000 ? "\n[...]" : "");

  let detectedSkills = [...userProfile.skills];
  const lower = cleanText.toLowerCase();

  if (/\d+%|\d+\s*k€|\d+\s*ke|chiffre|croissance|hausse|optimisation|ROI|KPI|chiffre d'affaires/i.test(text)) {
    if (!detectedSkills.includes("Orienté résultats")) detectedSkills.push("Orienté résultats");
  }

  if (lower.includes("déployer") || lower.includes("déploiement") || lower.includes("projet") || lower.includes("lancement") || lower.includes("refonte") || lower.includes("pilotage")) {
    if (!detectedSkills.includes("Gestion de projet")) detectedSkills.push("Gestion de projet");
  }

  if (lower.includes("management") || lower.includes("équipe") || lower.includes("manager") || lower.includes("leadership") || lower.includes("encadrement")) {
    if (!detectedSkills.includes("Management")) detectedSkills.push("Management");
  }

  if (lower.includes("expérience client") || lower.includes("cx") || lower.includes("satisfaction") || lower.includes("relation client") || lower.includes("voc")) {
    if (!detectedSkills.includes("Expérience Client")) detectedSkills.push("Expérience Client");
  }

  if (lower.includes("data") || lower.includes("données") || lower.includes("analyse") || lower.includes("bi") || lower.includes("sql")) {
    if (!detectedSkills.includes("Data & Analytics")) detectedSkills.push("Data & Analytics");
  }

  userProfile.cvText = cleanText;
  userProfile.skills = detectedSkills;
  renderSkillsPills();
}

function saveProfileData(){
  userProfile.cvText=document.getElementById("cvInput").value;
  userProfile.exclusions=document.getElementById("exclusionInput").value;
  userProfile.minSalary=Number(document.getElementById("salaryInput").value)||0;
  saveData();
  alert("Profil et compétences enregistrés !");
  renderSearchPage();
}

function showAlerts(){
currentView="alerts";closeProfileMenu();document.querySelectorAll(".tab-button").forEach(b=>b.classList.remove("active"));document.getElementById("viewSwitcher").style.display="none";
document.getElementById("mainContent").innerHTML=`<h1 class="page-title">Paramétrage des Alertes</h1><p class="page-description">Configure la surveillance automatique de tes compétences.</p><div class="alert-card"><div class="field"><label>🔍 Mots-clés d'alerte</label><input id="alertSearch" class="input" value="${escapeHTML(alertConfig.searchQuery)}" placeholder="Ex : Gestion de projet"></div><div class="field"><label>📍 Localisation</label><input id="alertLocation" class="input" value="${escapeHTML(alertConfig.locationQuery)}" placeholder="Ex : Paris, Île-de-France"></div><div class="field"><label>🤖 Instructions pour l'agent IA</label><textarea id="alertPrompt" class="textarea">${escapeHTML(alertConfig.aiPrompt)}</textarea></div><div class="field"><label>⏱️ Fréquence</label><select id="alertFrequency" class="select"><option ${alertConfig.frequency==="Quotidienne"?"selected":""}>Quotidienne</option><option ${alertConfig.frequency==="Hebdomadaire"?"selected":""}>Hebdomadaire</option></select></div><div class="field"><label>🕐 Heure</label><input id="alertTime" class="input" type="time" value="${alertConfig.time}"></div><button class="search-button" id="saveAlertBtn" style="width:100%;">Enregistrer l'alerte</button></div><button class="small-button" id="backAlertBtn">← Retour à la recherche</button>`;
document.getElementById("saveAlertBtn").addEventListener("click",saveAlertConfig);document.getElementById("backAlertBtn").addEventListener("click",renderSearchPage);
}
function saveAlertConfig(){alertConfig.searchQuery=document.getElementById("alertSearch").value;alertConfig.locationQuery=document.getElementById("alertLocation").value;alertConfig.aiPrompt=document.getElementById("alertPrompt").value;alertConfig.frequency=document.getElementById("alertFrequency").value;alertConfig.time=document.getElementById("alertTime").value;saveData();alert("Alerte enregistrée !")}

function showApplications(){
currentView="applications";closeProfileMenu();document.querySelectorAll(".tab-button").forEach(b=>b.classList.remove("active"));document.getElementById("viewSwitcher").style.display="none";
const list=jobs.filter(j=>applications[j.id]);let html=`<h1 class="page-title">Mes Candidatures</h1><p class="page-description">Suis ici l'évolution de tes candidatures.</p>`;
if(!list.length)html+='<div class="empty"><strong>Aucune candidature enregistrée</strong><br><br>Pour commencer, sélectionne un statut sur une annonce.</div>';else html+=`<div class="application-card">${list.map(j=>`<div class="application-row"><div><div class="application-title">${j.title}</div><div class="application-company">${j.company} · ${j.location}</div></div><div class="application-status">${applications[j.id]}</div></div>`).join("")}</div>`;
html+='<br><button class="small-button" id="backApplicationsBtn">← Retour à la recherche</button>';document.getElementById("mainContent").innerHTML=html;document.getElementById("backApplicationsBtn").addEventListener("click",renderSearchPage);
}
function escapeHTML(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}
function changeSort(){const m=document.getElementById("sortMobile"),d=document.getElementById("sort");if(m&&d){d.value=m.value;searchJobs()}}
function resetDemoData(){if(!confirm("Réinitialiser Job-Alert ?\n\nCela supprimera les favoris, candidatures, profil et alertes enregistrés sur cet appareil."))return;["jobAlertFavorites","jobAlertApplications","jobAlertProfile","jobAlertConfig"].forEach(k=>localStorage.removeItem(k));location.reload()}

document.getElementById("navSearch").addEventListener("click",renderSearchPage);
document.getElementById("navFavorites").addEventListener("click",showFavorites);
document.getElementById("profileBtn").addEventListener("click",showProfile);
document.getElementById("applicationsBtn").addEventListener("click",showApplications);
document.getElementById("alertsBtn").addEventListener("click",showAlerts);
document.getElementById("resetBtn").addEventListener("click",resetDemoData);
renderSearchPage();
</script>
