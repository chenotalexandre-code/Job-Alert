<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Job-Alert</title>
<!-- Inclusion de PDF.js pour la lecture et le scan des fichiers PDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
</script>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#182230;--muted:#667085;--border:#e4e7ec;--primary:#2563eb;--primary-dark:#1d4ed8;--green:#15803d;--red:#dc2626;--shadow:0 4px 18px rgba(16,24,40,.07)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}button,input,textarea,select{font:inherit}button{-webkit-tap-highlight-color:transparent}
.header{background:#111827;color:#fff;padding:14px 20px;position:sticky;top:0;z-index:1000;box-shadow:0 2px 10px rgba(0,0,0,.2)}
.header-inner{max-width:1200px;margin:auto;display:flex;align-items:center;justify-content:space-between}.logo{font-size:20px;font-weight:800;white-space:nowrap;cursor:pointer}.logo span{color:#60a5fa}
.profile-menu-container{position:relative}.profile-avatar{width:42px;height:42px;border-radius:50%;background:#1f2937;border:2px solid #374151;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;padding:0}.profile-avatar:hover{background:#374151}
.profile-dropdown{position:absolute;right:0;top:calc(100% + 10px);background:#fff;color:var(--text);border:1px solid var(--border);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.25);width:240px;display:none;z-index:99999;overflow:hidden}.profile-dropdown.open{display:block}
.dropdown-header{padding:14px 16px;border-bottom:1px solid var(--border);background:#f8fafc}.dropdown-name{font-weight:800;font-size:14px}.dropdown-subtitle{color:var(--muted);font-size:12px;margin-top:3px}
.dropdown-item{width:100%;border:0;background:#fff;padding:14px 16px;text-align:left;cursor:pointer;display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;color:var(--text)}.dropdown-item:hover{background:#f8fafc;color:var(--primary)}.dropdown-item.danger{color:var(--red)}
.container{max-width:1200px;margin:auto;padding:24px 16px 50px}.view-switcher{display:flex;justify-content:center;gap:10px;margin-bottom:24px}.tab-button{background:#fff;border:1px solid var(--border);color:var(--muted);padding:10px 24px;border-radius:30px;cursor:pointer;font-weight:600;font-size:14px;box-shadow:var(--shadow)}.tab-button.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.page-title{margin:0;font-size:27px}.page-description{color:var(--muted);margin:7px 0 20px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}.stat{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px}.stat-number{font-size:23px;font-weight:800}.stat-label{color:var(--muted);font-size:12px;margin-top:3px}
.search-card,.profile-card,.alert-card,.application-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;box-shadow:var(--shadow);margin-bottom:18px}.search-grid{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:10px}
.input,.textarea,.select{width:100%;min-height:44px;border:1px solid var(--border);border-radius:9px;padding:10px 12px;background:#fff;color:var(--text)}.textarea{min-height:140px;resize:vertical}.search-button{border:0;border-radius:9px;padding:0 20px;background:var(--primary);color:#fff;font-weight:700;cursor:pointer;min-height:44px}.search-button:hover{background:var(--primary-dark)}
.advanced{margin-top:12px}.advanced summary{cursor:pointer;color:var(--primary);font-size:14px;font-weight:600}.advanced-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}.results-header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.results-count{color:var(--muted);font-size:14px}.sort{width:190px}.jobs{display:grid;gap:12px}
.job{background:#fff;border:1px solid var(--border);border-radius:14px;padding:18px;box-shadow:var(--shadow)}.job-top{display:flex;justify-content:space-between;gap:15px}.job-title{font-size:18px;font-weight:750;margin:0 0 5px}.company{color:#475467;font-size:14px}.score{background:#ecfdf3;color:var(--green);font-size:13px;font-weight:700;border-radius:20px;padding:7px 10px;white-space:nowrap;height:fit-content}.meta{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0}.tag{background:#f2f4f7;color:#475467;padding:5px 8px;border-radius:6px;font-size:12px}.salary{font-size:15px;font-weight:750;color:var(--green);margin-bottom:10px}.ai-advice{background:#ecfdf3;border-left:4px solid var(--green);padding:10px;border-radius:6px;font-size:13px;color:var(--green);margin-bottom:14px}.job-footer{border-top:1px solid var(--border);margin-top:14px;padding-top:12px;display:flex;justify-content:space-between;align-items:center;gap:10px}.date{color:var(--muted);font-size:12px}.job-actions{display:flex;gap:8px;flex-wrap:wrap}.small-button{border:1px solid var(--border);background:#fff;border-radius:8px;padding:8px 12px;cursor:pointer;font-size:12px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.small-button:hover{background:#f8fafc}.small-button.favorite{color:#b45309;border-color:#f59e0b}.status-select{min-height:38px;border:1px solid var(--border);border-radius:8px;padding:0 8px;background:#fff;font-size:12px}
.application-row{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:14px 0;border-bottom:1px solid var(--border)}.application-row:last-child{border-bottom:0}.application-title{font-weight:700;margin-bottom:4px}.application-company{color:var(--muted);font-size:13px}.application-status{background:#eff6ff;color:var(--primary);border-radius:20px;padding:6px 10px;font-size:12px;font-weight:700}
.empty{background:#fff;border:1px dashed var(--border);border-radius:14px;padding:40px 20px;text-align:center;color:var(--muted)}.profile-section-title{font-size:15px;font-weight:800;margin-bottom:12px}.field{margin-bottom:16px}.field label{display:block;font-weight:700;margin-bottom:6px;font-size:14px}
.scan-status{font-size:13px;font-weight:700;color:var(--primary);margin-top:8px}
.skills-container{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;margin-bottom:12px;min-height:36px;padding:8px;background:#f8fafc;border:1px solid var(--border);border-radius:9px}
.skill-pill{background:#eff6ff;color:var(--primary);border:1px solid #bfdbfe;padding:6px 12px;border-radius:20px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.skill-pill button{background:none;border:none;color:var(--primary);cursor:pointer;font-weight:bold;font-size:14px;padding:0;line-height:1}
.skill-pill button:hover{color:var(--red)}
.skill-add-row{display:flex;gap:8px}
.ai-insights-box{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:10px;padding:12px 14px;margin-bottom:14px;font-size:13px;color:#166534;line-height:1.5}
@media(max-width:800px){.search-grid{grid-template-columns:1fr}.advanced-grid{grid-template-columns:1fr 1fr}}
@media(max-width:500px){.header{padding:12px 14px}.logo{font-size:17px}.container{padding:18px 10px 40px}.view-switcher{margin-bottom:18px}.tab-button{padding:9px 16px;font-size:13px}.advanced-grid{grid-template-columns:1fr}.stats{gap:6px}.stat{padding:10px}.stat-number{font-size:19px}.job{padding:14px}.job-top{display:block}.score{display:inline-block;margin-top:10px}.job-footer{align-items:flex-start;flex-direction:column}.job-actions{width:100%}.small-button,.status-select{flex:1}.profile-dropdown{width:220px}.application-row{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<header class="header">
<div class="header-inner">
<div class="logo" id="logoHome">🎯 Job-<span>Alert</span></div>
<div class="profile-menu-container">
<button class="profile-avatar" id="avatarBtn" type="button" title="Mon espace">👤</button>
<div class="profile-dropdown" id="profileDropdown">
<div class="dropdown-header"><div class="dropdown-name">Mon espace</div><div class="dropdown-subtitle">Gère ton profil et tes recherches</div></div>
<button class="dropdown-item" id="personalProfileBtn">👤 Mon profil</button>
<button class="dropdown-item" id="skillsProfileBtn">🏷️ Mes compétences & CV</button>
<button class="dropdown-item" id="applicationsBtn">📋 Mes candidatures</button>
<button class="dropdown-item" id="alertsBtn">🔔 Mes alertes</button>
<button class="dropdown-item danger" id="resetBtn">♻️ Réinitialiser les données</button>
</div>
</div>
</div>
</header>
<div class="container">
<div class="view-switcher" id="viewSwitcher">
<button class="tab-button active" id="navSearch" type="button">🔎 Recherche</button>
<button class="tab-button" id="navFavorites" type="button">⭐ Favoris</button>
</div>
<main class="main" id="mainContent"></main>
</div>
<script>
const jobs=[
{id:1,title:"Responsable Expérience Client",company:"TechCorp Paris",location:"Paris",contract:"CDI",remote:"Oui",salary:65000,maxSalary:75000,score:96,date:"2026-08-14",tags:["Expérience Client","VoC","Management","Gestion de projet","Orienté résultats","UX"],source:"LinkedIn",url:"https://www.linkedin.com/jobs/",aiAdvice:"💡 Conseil IA : Forte correspondance avec ton savoir-faire et tes indicateurs de résultats."},
{id:2,title:"Responsable Satisfaction Client",company:"Inovium Group",location:"Île-de-France",contract:"CDI",remote:"Oui",salary:60000,maxSalary:70000,score:92,date:"2026-08-13",tags:["Customer Experience","Management","Relation client","Vision Client"],source:"Indeed",url:"https://fr.indeed.com/",aiAdvice:"💡 Conseil IA : Excellent alignement avec tes compétences relationnelles et de pilotage."},
{id:3,title:"Product Owner Data",company:"DataPulse",location:"Paris",contract:"CDI",remote:"Oui",salary:55000,maxSalary:68000,score:84,date:"2026-08-11",tags:["Product Owner","Data","Agile","Gestion de projet","Automatisation"],source:"France Travail",url:"https://www.francetravail.fr/",aiAdvice:"💡 Conseil IA : Opportunité axée sur la gestion de projet et l'analyse de données."},
{id:4,title:"Chef de Projet Expérience Client",company:"Symphony CX",location:"Boulogne-Billancourt",contract:"CDI",remote:"Oui",salary:50000,maxSalary:60000,score:78,date:"2026-08-09",tags:["CX","Parcours Client","Gestion de projet","Voix du Client","Rigueur"],source:"LinkedIn",url:"https://www.linkedin.com/jobs/",aiAdvice:"💡 Conseil IA : Parfaitement adapté à ton expertise en gestion de projet CX."}
];

function loadJSON(key,fallback){try{const value=localStorage.getItem(key);return value?JSON.parse(value):fallback}catch(e){return fallback}}
let favorites=loadJSON("jobAlertFavorites",[]);
let applications=loadJSON("jobAlertApplications",{});
let userProfile=loadJSON("jobAlertProfile",{
  firstName: "",
  lastName: "",
  birthdate: "",
  phone: "",
  email: "",
  narrativeSummary: "",
  skills: [],
  exclusions:"",
  minSalary:0
});
let alertConfig=loadJSON("jobAlertConfig",{searchQuery:"",locationQuery:"",aiPrompt:"Recherche les offres correspondant à mon savoir-faire et mes compétences clés.",frequency:"Quotidienne",time:"20:00"});
let currentView="search";

function saveData(){localStorage.setItem("jobAlertFavorites",JSON.stringify(favorites));localStorage.setItem("jobAlertApplications",JSON.stringify(applications));localStorage.setItem("jobAlertProfile",JSON.stringify(userProfile));localStorage.setItem("jobAlertConfig",JSON.stringify(alertConfig))}
function setActiveTab(id){document.querySelectorAll(".tab-button").forEach(b=>b.classList.remove("active"));const b=document.getElementById(id);if(b)b.classList.add("active")}
function closeProfileMenu(){const d=document.getElementById("profileDropdown");if(d)d.classList.remove("open")}
function toggleProfileMenu(e){if(e)e.stopPropagation();document.getElementById("profileDropdown").classList.toggle("open")}
document.getElementById("avatarBtn").addEventListener("click",toggleProfileMenu);
document.getElementById("logoHome").addEventListener("click",renderSearchPage);
document.addEventListener("click",e=>{const d=document.getElementById("profileDropdown"),a=document.getElementById("avatarBtn");if(d&&!d.contains(e.target)&&!a.contains(e.target))closeProfileMenu()});

function renderSearchPage(){
currentView="search";setActiveTab("navSearch");document.getElementById("viewSwitcher").style.display="flex";
document.getElementById("mainContent").innerHTML=`
<h1 class="page-title">Trouver ton prochain poste</h1>
<p class="page-description">Recherche basée sur ton savoir-faire, ton profil narratif et tes compétences clés.</p>
<section class="stats">
<div class="stat"><div class="stat-number" id="totalJobs">0</div><div class="stat-label">offres affichées</div></div>
<div class="stat"><div class="stat-number" id="favoriteCount">${favorites.length}</div><div class="stat-label">favoris</div></div>
<div class="stat"><div class="stat-number" id="applicationCount">${Object.keys(applications).length}</div><div class="stat-label">candidatures</div></div>
</section>
<section class="search-card">
<div class="search-grid">
<input id="search" class="input" placeholder="Compétence, mot-clé, savoir-faire...">
<input id="location" class="input" placeholder="Localisation">
<input id="minSalary" class="input" type="number" placeholder="Salaire min. €">
<button class="search-button" id="searchButton">Rechercher</button>
</div>
<details class="advanced"><summary>Filtres avancés</summary>
<div class="advanced-grid">
<input id="company" class="input" placeholder="Entreprise">
<select id="contract" class="select"><option value="">Contrat</option><option value="CDI">CDI</option><option value="CDD">CDD</option><option value="Freelance">Freelance</option></select>
<select id="remote" class="select"><option value="">Télétravail</option><option value="Oui">Télétravail possible</option><option value="Non">Pas de télétravail</option></select>
<select id="sort" class="select"><option value="score">Pertinence (Match)</option><option value="date">Plus récentes</option><option value="salary">Salaire décroissant</option></select>
</div></details>
</section>
<div class="results-header"><div class="results-count" id="resultsCount"></div><select id="sortMobile" class="select sort"><option value="score">Pertinence (Match)</option><option value="date">Plus récentes</option><option value="salary">Salaire décroissant</option></select></div>
<section id="jobs" class="jobs"></section>`;
["search","location","company","minSalary"].forEach(id=>document.getElementById(id).addEventListener("input",searchJobs));
document.getElementById("contract").addEventListener("change",searchJobs);
document.getElementById("remote").addEventListener("change",searchJobs);
document.getElementById("sort").addEventListener("change",searchJobs);
document.getElementById("sortMobile").addEventListener("change",changeSort);
document.getElementById("searchButton").addEventListener("click",searchJobs);
searchJobs();
}

function searchJobs(){
if(currentView!=="search")return;
const search=document.getElementById("search")?.value.trim().toLowerCase()||"";
const location=document.getElementById("location")?.value.trim().toLowerCase()||"";
const company=document.getElementById("company")?.value.trim().toLowerCase()||"";
const salary=Number(document.getElementById("minSalary")?.value)||0;
const contract=document.getElementById("contract")?.value||"";
const remote=document.getElementById("remote")?.value||"";
const sort=document.getElementById("sort")?.value||"score";

let results=jobs.filter(job=>{
const text=(job.title+" "+job.company+" "+job.location+" "+job.tags.join(" ")).toLowerCase();
const exclusionWords=(userProfile.exclusions||"").toLowerCase().split(",").map(w=>w.trim()).filter(Boolean);
if(exclusionWords.some(w=>text.includes(w)))return false;

if(search && !text.includes(search)) return false;
if(location && !job.location.toLowerCase().includes(location)) return false;
if(company && !job.company.toLowerCase().includes(company)) return false;
if(salary && job.maxSalary < salary) return false;
if(contract && job.contract !== contract) return false;
if(remote && job.remote !== remote) return false;

return true;
});

// --- MOTEUR DE MATCHING SÉMANTIQUE CORRIGÉ & INTELLIGENT ---
results.forEach(job => {
  if(userProfile.skills && userProfile.skills.length > 0) {
    const userText = (userProfile.narrativeSummary + " " + userProfile.skills.join(" ")).toLowerCase();
    const jobKeywords = [job.title.toLowerCase(), ...job.tags.map(t => t.toLowerCase())];
    
    let matchedCount = 0;
    jobKeywords.forEach(kw => {
      const words = kw.split(/[\s-/]+/);
      const hasMatch = words.some(w => w.length > 2 && userText.includes(w));
      if(hasMatch) matchedCount++;
    });

    const ratio = matchedCount / jobKeywords.length;
    // Un profil bien rempli monte à 96% - 99% pour les postes ultra-compatibles
    let calculatedScore = Math.round(75 + (ratio * 24));
    job.score = Math.min(99, Math.max(60, calculatedScore));
  } else {
    job.score = 50; // Score neutre si aucune compétence n'est renseignée
  }
});

if(sort==="salary")results.sort((a,b)=>b.salary-a.salary);
if(sort==="date")results.sort((a,b)=>new Date(b.date)-new Date(a.date));
if(sort==="score")results.sort((a,b)=>b.score-a.score);
displayJobs(results);
}

function displayJobs(results){
const container=document.getElementById("jobs");if(!container)return;
const total=document.getElementById("totalJobs");if(total)total.textContent=results.length;
const count=document.getElementById("resultsCount");if(count)count.textContent=results.length+" offre"+(results.length>1?"s":"");
if(!results.length){container.innerHTML='<div class="empty"><strong>Aucune offre trouvée</strong><br><span>Modifie tes critères ou ton socle de compétences.</span></div>';return}
container.innerHTML=results.map(job=>{
const fav=favorites.includes(job.id),app=applications[job.id]||"";
return `<article class="job"><div class="job-top"><div><h2 class="job-title">${job.title}</h2><div class="company">${job.company} · ${job.location}</div></div><div class="score">${job.score}% match</div></div><div class="meta"><span class="tag">${job.contract}</span><span class="tag">${job.remote==="Oui"?"Télétravail":"Sur site"}</span>${job.tags.map(t=>`<span class="tag">${t}</span>`).join("")}</div><div class="salary">${job.salary.toLocaleString("fr-FR")} – ${job.maxSalary.toLocaleString("fr-FR")} € / an</div><div class="ai-advice">${job.aiAdvice}</div><div class="job-footer"><div class="date">Publiée le ${new Date(job.date).toLocaleDateString("fr-FR")} · Source : ${job.source}</div><div class="job-actions"><a href="${job.url}" target="_blank" class="small-button" style="background:var(--primary);color:#fff;border-color:var(--primary);">🔗 Voir l'offre</a><button class="small-button ${fav?"favorite":""}" onclick="toggleFavorite(${job.id})">${fav?"★ Favori":"☆ Favori"}</button><select class="status-select" onchange="setApplication(${job.id},this.value)"><option value="">Suivi</option><option value="À contacter" ${app==="À contacter"?"selected":""}>À contacter</option><option value="Candidature envoyée" ${app==="Candidature envoyée"?"selected":""}>Candidature envoyée</option><option value="Entretien" ${app==="Entretien"?"selected":""}>Entretien</option></select></div></div></article>`}).join("");
}

function toggleFavorite(id){favorites.includes(id)?favorites=favorites.filter(x=>x!==id):favorites.push(id);saveData();currentView==="search"?searchJobs():showFavorites()}
function setApplication(id,status){status?applications[id]=status:delete applications[id];saveData();updateCounters()}
function updateCounters(){const f=document.getElementById("favoriteCount"),a=document.getElementById("applicationCount");if(f)f.textContent=favorites.length;if(a)a.textContent=Object.keys(applications).length}
function showFavorites(){
currentView="favorites";setActiveTab("navFavorites");document.getElementById("viewSwitcher").style.display="flex";
document.getElementById("mainContent").innerHTML='<h1 class="page-title">Mes Offres Favorites</h1><p class="page-description">Retrouve ici les opportunités basées sur ton savoir-faire.</p><section id="jobs" class="jobs"></section>';
displayJobs(jobs.filter(j=>favorites.includes(j.id)));
}

// --- GESTION MON PROFIL ---
function showPersonalProfile(){
currentView="personalProfile";closeProfileMenu();document.querySelectorAll(".tab-button").forEach(b=>b.classList.remove("active"));document.getElementById("viewSwitcher").style.display="none";

document.getElementById("mainContent").innerHTML=`
<h1 class="page-title">Mon Profil Personnel</h1>
<p class="page-description">Renseigne tes informations personnelles et coordonnées.</p>

<div class="profile-card">
  <div class="profile-section-title">👤 État civil & Coordonnées</div>
  <div class="field"><label>Prénom</label><input id="firstNameInput" class="input" value="${escapeHTML(userProfile.firstName)}"></div>
  <div class="field"><label>Nom</label><input id="lastNameInput" class="input" value="${escapeHTML(userProfile.lastName)}"></div>
  <div class="field"><label>Date de naissance</label><input id="birthdateInput" class="input" type="date" value="${escapeHTML(userProfile.birthdate)}"></div>
  <div class="field"><label>Téléphone</label><input id="phoneInput" class="input" type="tel" value="${escapeHTML(userProfile.phone)}"></div>
  <div class="field"><label>Email</label><input id="emailInput" class="input" type="email" value="${escapeHTML(userProfile.email)}"></div>
  <button class="search-button" id="savePersonalBtn" style="width:100%;">Enregistrer mon profil</button>
</div>
<button class="small-button" id="backPersonalBtn">← Retour à la recherche</button>`;

document.getElementById("savePersonalBtn").addEventListener("click", savePersonalData);
document.getElementById("backPersonalBtn").addEventListener("click", renderSearchPage);
}

function savePersonalData(){
  userProfile.firstName = document.getElementById("firstNameInput").value;
  userProfile.lastName = document.getElementById("lastNameInput").value;
  userProfile.birthdate = document.getElementById("birthdateInput").value;
  userProfile.phone = document.getElementById("phoneInput").value;
  userProfile.email = document.getElementById("emailInput").value;
  saveData();
  alert("Informations personnelles enregistrées !");
  renderSearchPage();
}

// --- GESTION MES COMPÉTENCES & MOTEUR INTELLIGENT DE CV ---
function showSkillsProfile(){
currentView="skillsProfile";closeProfileMenu();document.querySelectorAll(".tab-button").forEach(b=>b.classList.remove("active"));document.getElementById("viewSwitcher").style.display="none";

document.getElementById("mainContent").innerHTML=`
<h1 class="page-title">Mes Compétences & Socle Stratégique</h1>
<p class="page-description">Importe un CV (PDF) pour une analyse sémantique, ou gère manuellement tes compétences clés.</p>

<div class="profile-card">
  <div class="profile-section-title">🤖 Moteur d'analyse et d'extraction intelligente (PDF)</div>
  <div class="field">
    <label>📄 Déposer votre fichier CV (.pdf)</label>
    <input type="file" id="cvFile" accept=".pdf" class="input" style="padding:6px; cursor:pointer;">
    <button class="search-button" id="analyzeCvBtn" type="button" style="margin-top:12px; width:100%;">🧠 Lancer l'analyse sémantique et la synthèse</button>
    <div id="cvScanStatus" class="scan-status"></div>
  </div>
</div>

<div class="profile-card">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
    <div class="profile-section-title" style="margin-bottom:0;">🏷️ Compétences & Savoir-faire identifiés</div>
    <button class="small-button" id="clearAllSkillsBtn" type="button" style="color:var(--red); border-color:#fecaca; background:#fef2f2;">🗑️ Tout effacer</button>
  </div>

function renderSkillsPills() {
  const container = document.getElementById("skillsListContainer");
  if(!container) return;
  if(!userProfile.skills || userProfile.skills.length === 0) {
    container.innerHTML = '<span style="color:var(--muted); font-size:13px; padding:4px;">Aucune compétence définie. Importe ton CV ou ajoute-les manuellement.</span>';
    return;
  }
  container.innerHTML = userProfile.skills.map((skill, index) => `
    <div class="skill-pill">
      <span>${escapeHTML(skill)}</span>
      <button type="button" onclick="removeSkill(${index})" title="Supprimer">×</button>
    </div>
  `).join("");
}

function addNewSkill() {
  const input = document.getElementById("newSkillInput");
  const val = input.value.trim();
  if(val && !userProfile.skills.includes(val)) {
    userProfile.skills.push(val);
    input.value = "";
    renderSkillsPills();
  }
}

function clearAllSkills() {
  if(confirm("Veux-tu vraiment supprimer toutes les pastilles de compétences ?")) {
    userProfile.skills = [];
    saveData();
    renderSkillsPills();
  }
}

window.removeSkill = function(index) {
  userProfile.skills.splice(index, 1);
  renderSkillsPills();
}

async function handlePdfIntelligenceAnalysis() {
  const fileInput = document.getElementById("cvFile");
  const file = fileInput.files[0];
  const statusEl = document.getElementById("cvScanStatus");

  if (!file) {
    statusEl.textContent = "⚠️ Veuillez sélectionner un fichier PDF.";
    return;
  }

  statusEl.textContent = "🧠 Analyse sémantique avancée en cours (extraction des études, expériences, management et expertises)...";

  try {
    const arrayBuffer = await file.arrayBuffer();
    const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer });
    const pdfDoc = await loadingTask.promise;
    let fullText = "";

    for (let i = 1; i <= pdfDoc.numPages; i++) {
      const page = await pdfDoc.getPage(i);
      const textContent = await page.getTextContent();
      const pageText = textContent.items.map(item => item.str).join(" ");
      fullText += pageText + "\n";
    }

    if (!fullText.trim()) {
      statusEl.textContent = "⚠️ Le fichier PDF semble vide ou illisible.";
      return;
    }

    runAdvancedCVIntelligence(fullText);
    statusEl.textContent = `✨ Analyse intelligente réussie ! Synthèse narrative générée et ${userProfile.skills.length} compétences structurées.`;
  } catch (error) {
    console.error("Erreur lecture PDF:", error);
    statusEl.textContent = "❌ Erreur lors de la lecture du fichier PDF.";
  }
}

function runAdvancedCVIntelligence(text) {
  const raw = text.trim();
  const lower = raw.toLowerCase();

  let extractedSkills = [];

  // --- EXTRACTION ROBUSTE DE L'EXPÉRIENCE (Supporte 10 ans et formats variés) ---
  let yearsFound = "10";
  const expPatterns = [
    /(\d{1,2})\s*(?:ans|années)\s*(?:d['\s]*expérience|exp)?/i,
    /plus de (\d{1,2})\s*ans/i,
    /depuis\s*(\d{4})/i
  ];
  for(let pattern of expPatterns) {
    const match = lower.match(pattern);
    if(match) {
      if(pattern.source.includes("20")) { // cas "depuis 2014" par ex
        const yearVal = parseInt(match[1]);
        const currentYear = new Date().getFullYear();
        yearsFound = Math.max(1, currentYear - yearVal).toString();
      } else {
        yearsFound = match[1];
      }
      break;
    }
  }
  extractedSkills.push(`${yearsFound}+ ans d'expérience`);

  // --- DÉTECTION DU MANAGEMENT D'ÉQUIPE ---
  let teamSize = "3";
  const teamPatterns = [
    /(?:équipe|management|encadrement|manager)\s*(?:de|d'|d['\s]*effectif de|composée de)?\s*(\d{1,2})\s*(?:personnes|collaborateurs|salariés|membres)?/i,
    /encadrement de (\d{1,2})/i
  ];
  for(let pattern of teamPatterns) {
    const match = lower.match(pattern);
    if(match) {
      teamSize = match[1];
      break;
    }
  }
  if(lower.includes("management") || lower.includes("manager") || lower.includes("équipe") || lower.includes("encadrement")) {
    extractedSkills.push(`Management d'équipe (${teamSize} personnes)`);
  }

  // --- DÉTECTION DES DIPLÔMES ---
  let educationDegree = "Formation supérieure";
  const degrees = [
    { keyword: "master", label: "Master / Bac+5" },
    { keyword: "mastère", label: "Mastère Spécialisé" },
    { keyword: "ingénieur", label: "Diplôme d'Ingénieur" },
    { keyword: "mba", label: "MBA" },
    { keyword: "bachelor", label: "Bachelor / Bac+3" },
    { keyword: "licence", label: "Licence" },
    { keyword: "doctorat", label: "Doctorat / Ph.D" },
    { keyword: "bts", label: "BTS / DUT" }
  ];
  for(let d of degrees) {
    if(lower.includes(d.keyword)) {
      educationDegree = d.label;
      extractedSkills.push(educationDegree);
      break;
    }
  }

  // --- TAXONOMIE MÉTIER INTELLIGENTE ---
  const intelligenceTaxonomy = [
    { keys: ["implémenter", "implementation", "déployer", "déploiement", "mise en place"], label: "Implémentation de solutions" },
    { keys: ["automatisation", "automation", "script", "workflow"], label: "Automatisation" },
    { keys: ["ux", "ui", "user experience", "parcours client", "ergonomie"], label: "UX & Parcours Client" },
    { keys: ["voc", "voix du client", "feedback", "satisfaction"], label: "VoC (Voix du Client)" },
    { keys: ["product owner", "product manager", "product strategy", "roadmap"], label: "Product Ownership" },
    { keys: ["négociation", "negociation", "contrats", "partenariats"], label: "Négociation & Partenariats" },
    { keys: ["prospection", "développement commercial", "acquisition"], label: "Prospection Stratégique" },
    { keys: ["étude de marché", "etude de marche", "benchmark", "veille"], label: "Étude de marché" },
    { keys: ["gestion de risque", "risques", "conformité", "audit"], label: "Gestion de risque" },
    { keys: ["innovation", "r&d", "transformation digitale"], label: "Innovation & Transformation" },
    { keys: ["vision client", "customer centric", "orientation client"], label: "Vision Client" },
    { keys: ["rigueur", "qualité", "excellence opérationnelle"], label: "Rigueur Opérationnelle" },
    { keys: ["gestion de projet", "chef de projet", "project management", "pmo"], label: "Gestion de projet" },
    { keys: ["expérience client", "customer experience", "cx"], label: "Expérience Client" },
    { keys: ["agile", "scrum", "kanban", "sprints"], label: "Méthodologie Agile" },
    { keys: ["data", "analytics", "sql", "python", "bi", "reporting"], label: "Data & Analytics" },
    { keys: ["kpi", "roi", "performance", "indicateurs"], label: "Pilotage par KPI & ROI" },
    { keys: ["stratégie", "strategic", "planification"], label: "Stratégie d'entreprise" }
  ];

  intelligenceTaxonomy.forEach(item => {
    if(item.keys.some(k => lower.includes(k))) {
      if(!extractedSkills.includes(item.label)) {
        extractedSkills.push(item.label);
      }
    }
  });

  userProfile.skills = extractedSkills;

  let generatedNarrative = `Parcours professionnel senior de ${yearsFound}+ années d'expérience, appuyé par un cursus académique de type ${educationDegree}. ` +
    `Reconnu pour une expertise avérée dans l'implémentation de solutions, la conduite de projets stratégiques et le pilotage opérationnel (management d'une équipe de ${teamSize} collaborateurs). ` +
    `Forces principales : ${extractedSkills.slice(0, 8).join(', ')}. ` +
    `Motivé par l'innovation, l'excellence opérationnelle, la vision client et la culture du résultat mesurable (KPI, ROI, optimisation des processus).`;

  userProfile.narrativeSummary = generatedNarrative;

  const narrativeEl = document.getElementById("narrativeInput");
  if(narrativeEl) narrativeEl.value = generatedNarrative;
  renderSkillsPills();
}
