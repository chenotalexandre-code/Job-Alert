<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Job Alert</title>

<style>
:root {
  --bg: #f5f7fb;
  --card: #ffffff;
  --text: #182230;
  --muted: #667085;
  --border: #e4e7ec;
  --primary: #2563eb;
  --primary-dark: #1d4ed8;
  --green: #15803d;
  --orange: #c2410c;
  --red: #dc2626;
  --shadow: 0 4px 18px rgba(16,24,40,.07);
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, Helvetica, sans-serif;
}

button,
input,
textarea,
select {
  font: inherit;
}

.header {
  background: #111827;
  color: white;
  padding: 18px 20px;
}

.header-inner {
  max-width: 1200px;
  margin: auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo {
  font-size: 22px;
  font-weight: 800;
}

.logo span {
  color: #60a5fa;
}

.header-subtitle {
  color: #cbd5e1;
  font-size: 13px;
  margin-top: 4px;
}

.container {
  max-width: 1200px;
  margin: auto;
  padding: 24px 16px 50px;
}

.dashboard {
  display: grid;
  grid-template-columns: 220px 1fr;
  gap: 20px;
}

.sidebar {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 12px;
  height: fit-content;
  box-shadow: var(--shadow);
}

.nav-item {
  width: 100%;
  border: 0;
  background: transparent;
  padding: 12px;
  text-align: left;
  border-radius: 9px;
  color: #475467;
  cursor: pointer;
  margin-bottom: 3px;
}

.nav-item.active {
  background: #eff6ff;
  color: var(--primary);
  font-weight: 700;
}

.main {
  min-width: 0;
}

.page-title {
  margin: 0;
  font-size: 27px;
}

.page-description {
  color: var(--muted);
  margin: 7px 0 20px;
}

.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 18px;
}

.stat {
  background: white;
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px;
}

.stat-number {
  font-size: 23px;
  font-weight: 800;
}

.stat-label {
  color: var(--muted);
  font-size: 12px;
  margin-top: 3px;
}

.search-card,
.profile-card,
.alert-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 16px;
  box-shadow: var(--shadow);
  margin-bottom: 18px;
}

.search-grid {
  display: grid;
  grid-template-columns: 2fr 1fr 1fr auto;
  gap: 10px;
}

.input,
.textarea,
.select {
  width: 100%;
  min-height: 44px;
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 10px 12px;
  background: white;
  color: var(--text);
}

.textarea {
  min-height: 100px;
  resize: vertical;
}

.search-button {
  border: 0;
  border-radius: 9px;
  padding: 0 20px;
  background: var(--primary);
  color: white;
  font-weight: 700;
  cursor: pointer;
}

.advanced {
  margin-top: 12px;
}

.advanced summary {
  cursor: pointer;
  color: var(--primary);
  font-size: 14px;
  font-weight: 600;
}

.advanced-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin-top: 12px;
}

.results-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 12px;
}

.results-count {
  color: var(--muted);
  font-size: 14px;
}

.sort {
  width: 190px;
}

.jobs {
  display: grid;
  gap: 12px;
}

.job {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 18px;
  box-shadow: var(--shadow);
}

.job-top {
  display: flex;
  justify-content: space-between;
  gap: 15px;
}

.job-title {
  font-size: 18px;
  font-weight: 750;
  margin: 0 0 5px;
}

.company {
  color: #475467;
  font-size: 14px;
}

.score {
  background: #ecfdf3;
  color: var(--green);
  font-size: 13px;
  font-weight: 700;
  border-radius: 20px;
  padding: 7px 10px;
  white-space: nowrap;
  height: fit-content;
}

.meta {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin: 14px 0;
}

.tag {
  background: #f2f4f7;
  color: #475467;
  padding: 5px 8px;
  border-radius: 6px;
  font-size: 12px;
}

.salary {
  font-size: 15px;
  font-weight: 750;
  color: var(--green);
  margin-bottom: 10px;
}

.ai-advice {
  background: #ecfdf3;
  border-left: 4px solid var(--green);
  padding: 10px;
  border-radius: 6px;
  font-size: 13px;
  color: var(--green);
  margin-bottom: 14px;
}

.job-footer {
  border-top: 1px solid var(--border);
  margin-top: 14px;
  padding-top: 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}

.date {
  color: var(--muted);
  font-size: 12px;
}

.job-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.small-button {
  border: 1px solid var(--border);
  background: white;
  border-radius: 8px;
  padding: 8px 12px;
  cursor: pointer;
  font-size: 12px;
}

.small-button.primary {
  background: var(--primary);
  color: white;
  border-color: var(--primary);
}

.small-button.favorite {
  color: #b45309;
  border-color: #f59e0b;
}

.status-select {
  min-height: 38px;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 0 8px;
  background: white;
  font-size: 12px;
}

.empty {
  background: white;
  border: 1px dashed var(--border);
  border-radius: 14px;
  padding: 40px 20px;
  text-align: center;
  color: var(--muted);
}

@media (max-width: 800px) {
  .dashboard {
    grid-template-columns: 1fr;
  }
  .sidebar {
    display: flex;
    overflow-x: auto;
    gap: 4px;
  }
  .nav-item {
    white-space: nowrap;
    width: auto;
  }
  .search-grid {
    grid-template-columns: 1fr;
  }
  .advanced-grid {
    grid-template-columns: 1fr 1fr;
  }
}

@media (max-width: 500px) {
  .container {
    padding: 18px 10px 40px;
  }
  .advanced-grid {
    grid-template-columns: 1fr;
  }
  .stats {
    gap: 6px;
  }
  .stat {
    padding: 10px;
  }
  .stat-number {
    font-size: 19px;
  }
  .job {
    padding: 14px;
  }
  .job-top {
    display: block;
  }
  .score {
    display: inline-block;
    margin-top: 10px;
  }
  .job-footer {
    align-items: flex-start;
    flex-direction: column;
  }
  .job-actions {
    width: 100%;
  }
  .small-button,
  .status-select {
    flex: 1;
  }
}
</style>
</head>

<body>

<header class="header">
  <div class="header-inner">
    <div>
      <div class="logo">🎯 Job-<span>Alert</span></div>
      <div class="header-subtitle">Ta veille emploi, centralisée et personnalisée</div>
    </div>
  </div>
</header>

<div class="container">
  <div class="dashboard">
    <aside class="sidebar">
      <button class="nav-item active" id="navSearch" onclick="showAll()">🔎 Recherche</button>
      <button class="nav-item" id="navFavorites" onclick="showFavorites()">⭐ Favoris</button>
      <button class="nav-item" id="navApplications" onclick="showApplications()">📋 Candidatures</button>
      <button class="nav-item" id="navAlerts" onclick="showAlerts()">🔔 Alertes & Agent IA</button>
      <button class="nav-item" id="navProfile" onclick="showProfile()">⚙️ Mon Profil & CV</button>
    </aside>

    <main class="main" id="mainContent">
      <!-- Le contenu dynamique sera injecté ici -->
    </main>
  </div>
</div>

<script>
const jobs = [
  {
    id: 1,
    title: "Responsable Expérience Client",
    company: "Entreprise exemple",
    location: "Paris",
    contract: "CDI",
    remote: "Oui",
    salary: 65000,
    maxSalary: 75000,
    score: 96,
    date: "2026-08-14",
    tags: ["Expérience Client", "VoC", "Management"],
    source: "Entreprise",
    aiAdvice: "💡 Conseil IA : 'Je dois impérativement postuler (forte coïncidence avec ton CV)'"
  },
  {
    id: 2,
    title: "Responsable Satisfaction Client",
    company: "Entreprise exemple",
    location: "Île-de-France",
    contract: "CDI",
    remote: "Oui",
    salary: 60000,
    maxSalary: 70000,
    score: 92,
    date: "2026-08-13",
    tags: ["Customer Experience", "Management"],
    source: "LinkedIn",
    aiAdvice: "💡 Conseil IA : 'Tente ta chance, profil très recherché sur ce secteur'"
  },
  {
    id: 3,
    title: "Product Owner Data",
    company: "Entreprise exemple",
    location: "Paris",
    contract: "CDI",
    remote: "Oui",
    salary: 55000,
    maxSalary: 68000,
    score: 84,
    date: "2026-08-11",
    tags: ["Product", "Data", "Agile"],
    source: "France Travail",
    aiAdvice: "💡 Conseil IA : 'Bon match technique, quelques compétences à valoriser'"
  },
  {
    id: 4,
    title: "Chef de Projet Expérience Client",
    company: "Entreprise exemple",
    location: "Boulogne-Billancourt",
    contract: "CDI",
    remote: "Oui",
    salary: 50000,
    maxSalary: 60000,
    score: 78,
    date: "2026-08-09",
    tags: ["CX", "Parcours Client", "Voix du Client"],
    source: "LinkedIn",
    aiAdvice: "💡 Conseil IA : 'Opportunité intéressante à explorer en backup'"
  }
];

let favorites = JSON.parse(localStorage.getItem("jobAlertFavorites") || "[]");
let applications = JSON.parse(localStorage.getItem("jobAlertApplications") || "{}");
let userProfile = JSON.parse(localStorage.getItem("jobAlertProfile") || JSON.stringify({
  cvText: "Expérience en gestion de projet, relation client, satisfaction et management d'équipe.",
  targetJobs: "Responsable Expérience Client, Chef de Projet",
  exclusions: "SSII, Prestation de service pure, 100% commercial terrain",
  minSalary: 50000
}));

let alertConfig = JSON.parse(localStorage.getItem("jobAlertConfig") || JSON.stringify({
  searchQuery: "Expérience Client",
  locationQuery: "Paris",
  aiPrompt: "Analyse les offres et ne retiens que celles qui mettent en avant le management d'équipe et le télétravail hybride.",
  frequency: "Quotidienne",
  time: "20:00"
}));

let currentView = "search";

function saveData() {
  localStorage.setItem("jobAlertFavorites", JSON.stringify(favorites));
  localStorage.setItem("jobAlertApplications", JSON.stringify(applications));
  localStorage.setItem("jobAlertProfile", JSON.stringify(userProfile));
  localStorage.setItem("jobAlertConfig", JSON.stringify(alertConfig));
}

function setActiveNav(navId) {
  document.querySelectorAll(".nav-item").forEach(btn => btn.classList.remove("active"));
  const activeBtn = document.getElementById(navId);
  if (activeBtn) activeBtn.classList.add("active");
}

function renderSearchPage() {
  currentView = "search";
  setActiveNav("navSearch");

  const main = document.getElementById("mainContent");
  if (!main) return;

  main.innerHTML = `
    <h1 class="page-title">Trouver ton prochain poste</h1>
    <p class="page-description">Recherche, filtre et compare les opportunités qui correspondent à tes critères.</p>

    <section class="stats">
      <div class="stat">
        <div class="stat-number" id="totalJobs">0</div>
        <div class="stat-label">offres affichées</div>
      </div>
      <div class="stat">
        <div class="stat-number" id="favoriteCount">${favorites.length}</div>
        <div class="stat-label">favoris</div>
      </div>
      <div class="stat">
        <div class="stat-number" id="applicationCount">${Object.keys(applications).length}</div>
        <div class="stat-label">candidatures</div>
      </div>
    </section>

    <section class="search-card">
      <div class="search-grid">
        <input id="search" class="input" placeholder="Poste, compétence, mot-clé..." oninput="searchJobs()">
        <input id="location" class="input" placeholder="Localisation" oninput="searchJobs()">
        <input id="minSalary" class="input" type="number" placeholder="Salaire min. €" oninput="searchJobs()">
        <button class="search-button" onclick="searchJobs()">Rechercher</button>
      </div>

      <details class="advanced">
        <summary>Filtres avancés</summary>
        <div class="advanced-grid">
          <input id="company" class="input" placeholder="Entreprise" oninput="searchJobs()">
          <select id="contract" class="select" onchange="searchJobs()">
            <option value="">Contrat</option>
            <option value="CDI">CDI</option>
            <option value="CDD">CDD</option>
            <option value="Freelance">Freelance</option>
          </select>
          <select id="remote" class="select" onchange="searchJobs()">
            <option value="">Télétravail</option>
            <option value="Oui">Télétravail possible</option>
            <option value="Non">Pas de télétravail</option>
          </select>
          <select id="sort" class="select" onchange="searchJobs()">
            <option value="score">Pertinence</option>
            <option value="date">Plus récentes</option>
            <option value="salary">Salaire décroissant</option>
          </select>
        </div>
      </details>
    </section>

    <div class="results-header">
      <div class="results-count" id="resultsCount"></div>
      <select id="sortMobile" class="select sort" onchange="changeSort()">
        <option value="score">Pertinence</option>
        <option value="date">Plus récentes</option>
        <option value="salary">Salaire décroissant</option>
      </select>
    </div>

    <section id="jobs" class="jobs"></section>
  `;
  searchJobs();
}

function showAlerts() {
  currentView = "alerts";
  setActiveNav("navAlerts");

  const main = document.getElementById("mainContent");
  main.innerHTML = `
    <h1 class="page-title">Paramétrage des Alertes & Agent IA</h1>
    <p class="page-description">Configure ta recherche automatisée et donne des instructions personnalisées à ton agent de recherche.</p>

    <div class="alert-card">
      <div style="margin-bottom: 14px;">
        <label style="display: block; font-weight: 700; margin-bottom: 6px; font-size: 14px;">🔍 Recherche par mots-clés</label>
        <input id="alertSearch" class="input" type="text" value="${alertConfig.searchQuery}" placeholder="Ex: Expérience Client, Product Owner...">
      </div>

      <div style="margin-bottom: 14px;">
        <label style="display: block; font-weight: 700; margin-bottom: 6px; font-size: 14px;">📍 Localisation visée</label>
        <input id="alertLocation" class="input" type="text" value="${alertConfig.locationQuery}" placeholder="Ex: Paris, Île-de-France, Remote...">
      </div>

      <div style="margin-bottom: 14px;">
        <label style="display: block; font-weight: 700; margin-bottom: 6px; font-size: 14px;">🤖 Prompt personnalisé pour l'agent IA</label>
        <textarea id="alertPrompt" class="textarea" placeholder="Ex: Sois très strict sur les salaires minimums et privilégie les entreprises éco-responsables...">${alertConfig.aiPrompt}</textarea>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 18px;">
        <div>
          <label style="display: block; font-weight: 700; margin-bottom: 6px; font-size: 14px;">⏱️ Fréquence</label>
          <select id="alertFrequency" class="select">
            <option value="Quotidienne" ${alertConfig.frequency === "Quotidienne" ? "selected" : ""}>Quotidienne</option>
            <option value="Hebdomadaire" ${alertConfig.frequency === "Hebdomadaire" ? "selected" : ""}>Hebdomadaire</option>
          </select>
        </div>
        <div>
          <label style="display: block; font-weight: 700; margin-bottom: 6px; font-size: 14px;">⏰ Horaire de l'alerte</label>
          <input id="alertTime" class="input" type="time" value="${alertConfig.time}">
        </div>
      </div>

      <div style="display: flex; gap: 10px;">
        <button class="search-button" style="flex: 1; min-height: 48px;" onclick="saveAlertConfig()">Enregistrer l'alerte</button>
        <button class="small-button" style="padding: 0 20px; font-weight: 700; background: #f2f4f7;" onclick="testAlerteAgent()">Tester l'agent</button>
      </div>
    </div>
  `;
}

function saveAlertConfig() {
  alertConfig.searchQuery = document.getElementById("alertSearch").value;
  alertConfig.locationQuery = document.getElementById("alertLocation").value;
  alertConfig.aiPrompt = document.getElementById("alertPrompt").value;
  alertConfig.frequency = document.getElementById("alertFrequency").value;
  alertConfig.time = document.getElementById("alertTime").value;

  saveData();
  alert("Paramètres d'alerte enregistrés avec succès ! L'agent se basera sur ton prompt pour la prochaine veille.");
}

function testAlerteAgent() {
  alert("🤖 Agent IA : J'ai bien pris en compte ton prompt !\n\n' " + document.getElementById("alertPrompt").value + " '\n\nJe scannerai les offres à " + document.getElementById("alertTime").value + " selon la fréquence " + document.getElementById("alertFrequency").value + ".");
}

function showProfile() {
  currentView = "profile";
  setActiveNav("navProfile");

  const main = document.getElementById("mainContent");
  main.innerHTML = `
    <h1 class="page-title">Mon Profil & Préférences</h1>
    <p class="page-description">Ces informations permettent à l'IA d'analyser les offres et d'ajuster le scoring sur mesure.</p>

    <div class="profile-card">
      <div style="margin-bottom: 14px;">
        <label style="display: block; font-weight: 700; margin-bottom: 6px; font-size: 14px;">📄 Résumé de ton CV / Compétences clés</label>
        <textarea id="cvInput" class="textarea" placeholder="Colle ton CV ou décris tes compétences...">${userProfile.cvText}</textarea>
      </div>

      <div style="margin-bottom: 14px;">
        <label style="display: block; font-weight: 700; margin-bottom: 6px; font-size: 14px;">🎯 Postes / Missions recherchés</label>
        <input id="targetInput" class="input" type="text" value="${userProfile.targetJobs}" placeholder="Ex: Chef de projet, Responsable...">
      </div>

      <div style="margin-bottom: 14px;">
        <label style="display: block; font-weight: 700; margin-bottom: 6px; font-size: 14px;">❌ Ce que tu NE veux pas (exclusions)</label>
        <input id="exclusionInput" class="input" type="text" value="${userProfile.exclusions}" placeholder="Ex: SSII, 100% présentiel...">
      </div>

      <div style="margin-bottom: 18px;">
        <label style="display: block; font-weight: 700; margin-bottom: 6px; font-size: 14px;">💰 Salaire minimum annuel (€)</label>
        <input id="salaryInput" class="input" type="number" value="${userProfile.minSalary}">
      </div>

      <button class="search-button" style="width: 100%; min-height: 48px;" onclick="saveProfileData()">Enregistrer mon profil</button>
    </div>
  `;
}

function saveProfileData() {
  userProfile.cvText = document.getElementById("cvInput").value;
  userProfile.targetJobs = document.getElementById("targetInput").value;
  userProfile.exclusions = document.getElementById("exclusionInput").value;
  userProfile.minSalary = Number(document.getElementById("salaryInput").value) || 0;
  
  saveData();
  alert("Profil enregistré avec succès ! Il sera pris en compte pour les recherches et l'IA.");
  renderSearchPage();
}

function searchJobs() {
  if (currentView !== "search") return;

  const search = document.getElementById("search") ? document.getElementById("search").value.toLowerCase() : "";
  const location = document.getElementById("location") ? document.getElementById("location").value.toLowerCase() : "";
  const company = document.getElementById("company") ? document.getElementById("company").value.toLowerCase() : "";
  const salary = document.getElementById("minSalary") ? Number(document.getElementById("minSalary").value) || 0 : 0;
  const contract = document.getElementById("contract") ? document.getElementById("contract").value : "";
  const remote = document.getElementById("remote") ? document.getElementById("remote").value : "";
  const sort = document.getElementById("sort") ? document.getElementById("sort").value : "score";

  let results = jobs.filter(job => {
    const text = (job.title + " " + job.company + " " + job.tags.join(" ")).toLowerCase();
    
    const exclusionWords = userProfile.exclusions.toLowerCase().split(",").map(w => w.trim()).filter(Boolean);
    const hasExcludedWord = exclusionWords.some(word => text.includes(word));
    if (hasExcludedWord) return false;

    return (
      (!s
